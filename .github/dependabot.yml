# Weekly dependency updates, grouped so each ecosystem opens one PR for minor/patch bumps.
# Security updates are separate (repo setting) and open as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/api/*", "/agents/*", "/web/host", "/dev/mock-msapi"]
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    groups:
      nuget-minor: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    groups:
      web-minor: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /templates/agents/typescript-mcp-agent
    schedule: { interval: monthly }

  - package-ecosystem: pip
    directory: /templates/agents/python-mcp-agent
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /dev
    schedule: { interval: monthly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
