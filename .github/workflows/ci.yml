name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: C# API + agent
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BLUEBOARD_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Build (warnings are errors)
        working-directory: api
        run: dotnet build Blueboard.slnx -c Release
      - name: Unit and integration tests (integration tests use the Postgres service)
        working-directory: api
        run: dotnet test --solution Blueboard.slnx -c Release --no-build
      - name: Build reference agent
        run: dotnet build agents/Blueboard.EnrichmentAgent -c Release

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build the web host
        run: dotnet build host -c Release

  infra:
    name: Bicep + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build + lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          for f in infra/network.bicep infra/private-endpoint.bicep infra/audit-export.bicep; do az bicep lint --file "$f"; done
      - name: Sentinel rule templates are valid JSON
        run: for f in infra/sentinel/*.json; do jq -e '.resources[0].properties.query' "$f" > /dev/null; done
      - name: shellcheck
        run: shellcheck -x -e SC1091 -s bash infra/*.sh infra/tests/*.sh
      - name: up.sh (stubbed steps; resume, hand-off, no secrets in state)
        run: ./infra/tests/up-test.sh
