name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: C# API + agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BLUEBOARD_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "10.0.x" }
      - name: Build (warnings are errors)
        working-directory: api
        run: dotnet build Blueboard.slnx -c Release
      - name: Unit and integration tests (integration tests use the Postgres service)
        working-directory: api
        run: dotnet test --solution Blueboard.slnx -c Release --no-build
      - name: Policy check (example policy must parse strictly)
        run: dotnet run --project api/Blueboard.Tools -c Release --no-build -- policy-check policy.example.json
      - name: Build agents (reference agent, template, SDK) and the demo mock API
        run: |
          dotnet build agents/Blueboard.EnrichmentAgent -c Release
          dotnet build agents/Blueboard.AgentTemplate -c Release
          dotnet build dev/mock-msapi -c Release
      - name: Agent SDK tests
        run: dotnet test --project agents/Blueboard.Agent.Sdk.Tests -c Release
      - name: No vulnerable NuGet packages (direct or transitive)
        run: ./scripts/check-nuget-vulns.sh

  demo-smoke:
    # The one-command local demo (issue #1): build the compose stack, wait for health, then check over MCP
    # (Bearer dev:enrichment-agent) that the three mock incidents were enriched and their actions are pending.
    name: Local demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the demo
        run: ./scripts/demo.sh up
      - name: Check incidents, agent output and pending actions over MCP
        run: ./scripts/demo-smoke.sh http://localhost:7370
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: ./scripts/demo.sh down

  web:
    name: React web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build the web host
        run: dotnet build host -c Release

  infra:
    name: Bicep + scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Bicep build + lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          for f in infra/network.bicep infra/private-endpoint.bicep infra/audit-export.bicep infra/alerts.bicep; do az bicep lint --file "$f"; done
      - name: Sentinel rule templates are valid JSON
        run: for f in infra/sentinel/*.json; do jq -e '.resources[0].properties.query' "$f" > /dev/null; done
      - name: shellcheck
        run: shellcheck -x -e SC1091 -s bash infra/*.sh infra/tests/*.sh scripts/*.sh
      - name: up.sh (stubbed steps; resume, hand-off, no secrets in state)
        run: ./infra/tests/up-test.sh
