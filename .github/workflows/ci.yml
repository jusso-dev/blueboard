name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: C# API + agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Build (warnings are errors)
        working-directory: api
        run: dotnet build Blueboard.slnx -c Release
      - name: Test
        working-directory: api
        run: dotnet test --solution Blueboard.slnx -c Release --no-build
      - name: Build reference agent
        run: dotnet build agents/Blueboard.EnrichmentAgent -c Release

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  infra:
    name: Bicep + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build + lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: shellcheck
        run: shellcheck -x -e SC1091 -s bash infra/*.sh
