# Builds the deployable packages for a version tag (v1.2.3), attaches them to the GitHub release with an SBOM and
# SHA-256 checksums, and records build provenance. BB_RELEASE=<tag> ./infra/up.sh deploys these artefacts (checksums
# and provenance verified) without building, so it runs in Azure Cloud Shell; without it, deploy.sh builds from source.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build release artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # create the release and upload assets
      id-token: write       # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: "10.0.x" }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }

      - name: Tag matches the version in Directory.Build.props and web/package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          props="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' api/Directory.Build.props)"
          web="$(jq -r .version web/package.json)"
          [[ "$tag" == "$props" && "$tag" == "$web" ]] || { echo "tag $tag, Directory.Build.props $props, web $web"; exit 1; }

      - name: Function App package
        run: |
          dotnet publish api/Blueboard.Api -c Release -o out/api --nologo
          (cd out/api && zip -qr "$GITHUB_WORKSPACE/blueboard-api-${GITHUB_REF_NAME}.zip" .)

      - name: Web App package (React build + ASP.NET Core host)
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          dotnet publish web/host -c Release -o out/web --nologo
          (cd out/web && zip -qr "$GITHUB_WORKSPACE/blueboard-web-${GITHUB_REF_NAME}.zip" .)

      - name: Operator CLI (policy-check, doctor, migrate), self-contained, for deploys without the .NET SDK
        run: |
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64; do
            dotnet publish api/Blueboard.Tools -c Release -r "$rid" --self-contained -p:PublishSingleFile=true -o "out/tools-$rid" --nologo
            tar -czf "blueboard-tools-${GITHUB_REF_NAME}-${rid}.tar.gz" -C "out/tools-$rid" .
          done

      - name: Infrastructure template
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile "blueboard-main-${GITHUB_REF_NAME}.json"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: blueboard-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: sha256sum blueboard-*.zip blueboard-*.json blueboard-tools-*.tar.gz > "blueboard-${GITHUB_REF_NAME}.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            blueboard-*.zip
            blueboard-main-*.json
            blueboard-tools-*.tar.gz

      - name: Publish the release (or add assets to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(blueboard-*.zip blueboard-*.json blueboard-*.sha256 blueboard-tools-*.tar.gz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi
